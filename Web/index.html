<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="darkreader-lock">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harmonia">
<title>Harmonia</title>
<style>
:root{
  --bg:#030303;--bg2:#161616;--bg3:#232323;--fg:#fff;--fg2:#aaa;--line:rgba(255,255,255,.1);
  --accent:#ff4e45;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --nav-h:56px;--mini-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);overflow-x:hidden;overscroll-behavior:none}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
svg{width:24px;height:24px;fill:currentColor;display:block}
#view{position:fixed;left:0;right:0;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:var(--sat);padding-bottom:calc(var(--nav-h) + var(--mini-h) + var(--sab) + 32px)}
.page{padding:0 16px 8px;min-width:0;position:relative}
.page.home::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--sat));height:calc(440px + var(--sat));pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 0% 0%,rgba(36,78,96,.55),transparent 62%),radial-gradient(110% 85% at 100% 8%,rgba(78,50,118,.5),transparent 64%),linear-gradient(rgba(22,34,38,.65),transparent)}
.page.home>*{position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:8px;min-height:56px}
.topbar h1{font-size:22px;margin:0;font-weight:700;flex:1;min-width:0}
.page.home .topbar{min-height:60px;margin-right:-8px}
.page.home .topbar h1{font-size:26px;font-weight:800;letter-spacing:.01em}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.iconbtn:active{background:var(--bg3)}
.notice{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg2);font-size:13px;margin:4px 0 12px}
.sec{margin:26px 0 8px}
.sec-h{display:flex;align-items:center;gap:12px;min-height:44px;margin:0 0 8px}
.sec-t{font-size:22px;line-height:1.2;font-weight:700;margin:0;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pillbtn{flex:none;min-height:44px;min-width:44px;display:flex;align-items:center}
.pillbtn span{display:flex;align-items:center;height:32px;padding:0 14px;border:1px solid rgba(255,255,255,.22);border-radius:16px;font-size:13px;font-weight:500;white-space:nowrap}
.pillbtn:active span{background:rgba(255,255,255,.12)}
.qp{display:flex;gap:16px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding-left:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qp::-webkit-scrollbar{display:none}
.qpage{flex:none;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start;scroll-snap-align:start}
.qtile{position:relative;padding-top:100%;border-radius:6px;overflow:hidden;background:var(--bg3);cursor:pointer;min-width:0}
.qtile .thumb{position:absolute;left:0;top:0;width:100%;height:100%;background:none}
.qtile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.qtile .qtt{position:absolute;left:8px;right:8px;bottom:6px;z-index:1;font-size:13px;line-height:1.25;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.qtile:active{opacity:.75}
.qdots{display:flex;justify-content:center;gap:6px;margin-top:12px;height:8px}
.qdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.qdots i.on{background:#fff}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar,.qgrid::-webkit-scrollbar{display:none}
.card{flex:none;width:152px;min-height:44px;cursor:pointer}
.card .thumb{width:152px;height:152px;border-radius:8px}
.card.round .thumb{border-radius:50%}
.card.round .ct,.card.round .cs{text-align:center}
.ct{font-size:15px;line-height:1.3;font-weight:500;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cs{font-size:13px;margin-top:2px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{position:relative;background:var(--bg3);overflow:hidden;flex:none}
.thumb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.qgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,64px);grid-auto-columns:min(88%,360px);column-gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding-left:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qgrid .row{scroll-snap-align:start}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 0;cursor:pointer;min-width:0}
.row .thumb{width:48px;height:48px;border-radius:4px}
.row.round .thumb{border-radius:50%}
.row .txt{flex:1;min-width:0}
.row .rt{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{font-size:13.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rd{font-size:12px;color:var(--fg2);flex:none;padding-left:4px}
.row:active{background:rgba(255,255,255,.06)}
.now .rt,.now .ct,.now .qt,.now .qtt{color:var(--accent)}
.songlist{margin:0}
.skel{padding:8px 0}
.skel i{display:block;height:16px;border-radius:8px;margin:14px 0;background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));background-size:200% 100%;animation:sh 1.2s linear infinite}
.skel i:nth-child(3n){width:60%}
.skel i.big{height:140px;border-radius:10px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.errbox{padding:28px 8px;text-align:center;color:var(--fg2)}
.errbox p{margin:0 0 14px;word-break:break-word}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 22px;border-radius:22px;background:var(--fg);color:#000;font-weight:700}
.btn.ghost{background:var(--bg3);color:var(--fg)}
.btn:disabled{opacity:.4}
.hint{color:var(--fg2);text-align:center;padding:32px 8px}
.sform{display:flex;gap:8px;padding:8px 0 4px}
.sform input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:0 16px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.sform input:focus{border-color:#666}
.bhead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 12px}
.bhead .thumb{width:min(60vw,220px);height:min(60vw,220px);border-radius:8px}
.bhead h2{margin:14px 0 2px;font-size:22px;word-break:break-word}
.bhead p{margin:0 0 14px;color:var(--fg2);font-size:13px}
#mini{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab));height:var(--mini-h);background:#212121;display:flex;align-items:center;z-index:20;overflow:hidden;padding-right:4px}
#mini[hidden]{display:none}
#mini .mbar{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.15)}
#mini .mbar i{display:block;height:100%;width:0;background:var(--fg)}
#mini .mopen{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:100%;padding:0 0 0 16px;text-align:left}
#mini .thumb{width:44px;height:44px;border-radius:4px}
#mini .txt{flex:1;min-width:0}
#mini .mt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ms{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .iconbtn{width:48px;height:48px}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);background:#0f0f0f;border-top:1px solid var(--line);display:flex;z-index:21}
#nav::after{content:"";position:absolute;left:0;right:0;top:100%;height:160px;background:#0f0f0f}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg2);text-decoration:none;font-size:10.5px;min-height:44px}
#nav a svg{width:26px;height:26px}
#nav a.on{color:var(--fg)}
#full{position:fixed;left:0;right:0;top:0;bottom:0;background:linear-gradient(#262626,#030303 70%);z-index:50;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 4px) 20px calc(var(--sab) + 24px)}
#full.open{transform:none;visibility:visible;transition:transform .28s ease}
.fhead{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.fhead span{font-size:13px;color:var(--fg2)}
.fart{width:min(84vw,46vh,420px);height:min(84vw,46vh,420px);margin:8px auto 18px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.finfo{display:block}
.ftitle{font-size:20px;font-weight:700;word-break:break-word}
.fsub{font-size:14px;color:var(--fg2);margin-top:2px;word-break:break-word}
.fstatrow{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:44px}
.fstat{font-size:12px;color:var(--accent);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;height:18px}
.fstatrow .btn{min-height:44px;padding:0 16px;font-size:13px}
.fstatrow .btn[hidden]{display:none}
.seekrow{margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;padding:0;background:transparent;touch-action:pan-y;display:block}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.45}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:-2px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 22px}
.ctrls .iconbtn{width:56px;height:56px}
.ctrls .iconbtn svg{width:34px;height:34px}
.ctrls .big{width:72px;height:72px;background:#fff;color:#000}
.ctrls .big:active{background:#ddd}
.ctrls .big svg{width:40px;height:40px}
.qh{font-size:16px;font-weight:700;margin:6px 0 4px;border-top:1px solid var(--line);padding-top:14px}
#qlist .row{min-height:52px}
#qlist .row .thumb{width:44px;height:44px}
#qlist .qt{color:inherit}
#sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .panel{width:100%;max-width:520px;background:#1c1c1c;border-radius:16px 16px 0 0;padding:18px 18px calc(var(--sab) + 18px);max-height:85vh;overflow-y:auto}
#sheet h3{margin:0 0 12px;font-size:18px}
#sheet p{margin:8px 0;color:var(--fg2);font-size:13px;word-break:break-word}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;min-height:48px;border-radius:12px;background:var(--bg3);font-weight:600}
.seg button.on{background:#fff;color:#000}
.sheetbtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
/* Home-screen app on iOS: the page area ends one status-bar height above the real bottom of the
   screen, which left a black strip under the bottom bar. Making the page that much taller fills it. */
@media (display-mode: standalone){html{min-height:calc(100% + env(safe-area-inset-top))}}
.ftitle{font-size:22px;font-weight:700;line-height:1.25}
.fsub{font-size:16px}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:22px;background:rgba(255,255,255,.1);color:var(--fg);font:inherit;font-size:14px;font-weight:500;white-space:nowrap}
.chipbtn svg{width:20px;height:20px;fill:currentColor}
.chipbtn.off{color:var(--fg2)}
.chipbtn:disabled{opacity:.5}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 4px}
.ctrls .iconbtn{width:52px;height:52px;color:var(--fg)}
.ctrls .iconbtn svg{width:30px;height:30px}
.ctrls .iconbtn.big{width:76px;height:76px;border-radius:50%;background:#fff;color:#000}
.ctrls .iconbtn.big svg{width:40px;height:40px}
.ctrls .iconbtn.tog{color:rgba(255,255,255,.45)}
.ctrls .iconbtn.tog.on{color:#fff}
.ctrls .iconbtn.tog svg{width:26px;height:26px}
.chipbtn.on{background:#fff;color:#000}
.chipbtn.icononly{padding:0 14px}
#sheet .panel{max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.plrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:16px;text-align:left}
.plrow span:last-child{color:var(--fg2);font-size:13px;flex:none}
.cmt{padding:12px 0;border-bottom:1px solid var(--line)}
.cmt .ca{font-size:13px;color:var(--fg2);margin-bottom:4px}
.cmt .cx{font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--mini-h) + var(--sab) + 20px);transform:translateX(-50%);max-width:86vw;padding:10px 16px;border-radius:10px;background:#f1f1f1;color:#0f0f0f;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#ptr{position:fixed;left:0;right:0;top:calc(var(--sat) + 6px);display:flex;justify-content:center;z-index:15;pointer-events:none;opacity:0;transition:opacity .15s}
#ptr.show{opacity:1}
#ptr span{padding:7px 14px;border-radius:16px;background:#212121;color:var(--fg);font-size:13px}
.page.home::before{-webkit-mask-image:linear-gradient(transparent,#000 120px);mask-image:linear-gradient(transparent,#000 120px)}
#full{background:linear-gradient(#030303,#262626 150px,#030303 75%)}
#full.dragging{transition:none}
/* Player screen: everything down to the transport buttons fits one screen. The artwork takes
   whatever height is left after the fixed-height rows, and long titles are cut to one line. */
.fart{--fa:min(84vw,420px,calc(100vh - 372px - var(--sat) - var(--sab)));width:var(--fa);height:var(--fa);margin:4px auto 14px}
@supports (height:100dvh){.fart{--fa:min(84vw,420px,calc(100dvh - 372px - var(--sat) - var(--sab)))}}
.ftitle,.fsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.fsub{font-size:15px;margin-top:3px}
.fstatrow{min-height:22px;margin-top:4px}
.fchips{margin:0 -20px;padding:10px 20px 4px;scroll-padding:0 20px}
.seekrow{margin-top:2px}
.ctrls{padding:6px 4px 10px}
/* Player v2: one fixed screen. The artwork spans the same width as the text below it and takes
   the height that is left; the "up next" bar sits at the bottom; the queue slides over it. */
#full{display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:#030303}
#full>*{flex:none}
#fullBg{position:absolute;left:-15%;right:-15%;top:-10%;bottom:-10%;z-index:-1;background-size:cover;background-position:center;filter:blur(60px) saturate(1.8) brightness(.62);opacity:0;transition:opacity .7s;pointer-events:none}
#fullBg.on{opacity:1}
#full{transition:transform .28s ease,visibility 0s .28s,background-color .8s ease}
#fullBg2{position:absolute;left:-30%;right:-30%;top:-20%;bottom:-20%;z-index:-1;background-size:cover;background-position:center;filter:blur(70px) saturate(2.2) brightness(.8);opacity:0;pointer-events:none}
#fullPulse{position:absolute;left:-20%;right:-20%;top:-10%;height:80%;z-index:-1;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:0;pointer-events:none}
#full::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--bar,rgba(3,3,3,0)),rgba(3,3,3,0) 120px),linear-gradient(rgba(3,3,3,.38),rgba(3,3,3,.2) 170px,rgba(3,3,3,.45) 62%,rgba(3,3,3,.88))}
#full .fart{flex:1 1 0;min-height:0;width:100%;height:auto;max-height:calc(100vw - 40px);margin:4px 0 14px;border-radius:12px}
.nextbar{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 0;border:0;border-top:1px solid rgba(255,255,255,.14);background:none;color:var(--fg);font:inherit;text-align:left}
.nextbar .thumb{width:44px;height:44px;border-radius:4px}
.nextbar .txt{flex:1;min-width:0}
.nextbar .nl{font-size:12px;color:var(--fg2)}
.nextbar .nt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbar .chev{flex:none;display:flex;color:var(--fg2)}
.nextbar .chev svg{width:26px;height:26px;fill:currentColor}
#qpanel{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 56px);z-index:3;background:#161616;border-radius:16px 16px 0 0;transform:translateY(103%);transition:transform .25s ease;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(var(--sab) + 16px)}
#qpanel{visibility:hidden}
#qpanel.open{transform:none;visibility:visible}
.qhead{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;min-height:54px;padding-left:8px;background:#161616;font-size:16px;font-weight:700}
.eqrow{padding:8px 0 2px}
.eqrow .eql{display:flex;justify-content:space-between;font-size:14px}
.eqrow .eql span:last-child{color:var(--fg2);font-variant-numeric:tabular-nums}
.eqrow input[type=range]{width:100%;height:30px;margin:0;accent-color:#fff;touch-action:pan-y}
/* An older rule still gave the transport row a 22px gap between buttons. On a narrow screen the
   five buttons plus gaps were wider than the row and spilled out to the right, which pushed the
   play button off centre. No fixed gap: the buttons are spread evenly instead. */
.ctrls{gap:0;margin:0}
#qlist .row{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .16s ease,opacity .16s ease;border-radius:8px}
#qlist .row.swiping{transition:none}
#qlist .row.lifted{transition:none;z-index:2;background:#2c2c2c;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#qpanel .qtip{font-size:12px;color:var(--fg2);padding:0 8px 8px}
.stylesel{width:100%;min-height:44px;margin-top:4px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#222;color:var(--fg);font:inherit;font-size:15px}
.eqrow input[type=range]:disabled{opacity:.35}
.hchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 6px;scrollbar-width:none;position:relative;z-index:1}
.hchips::-webkit-scrollbar{display:none}
.hchip{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:var(--fg);font:inherit;font-size:14px;font-weight:500;white-space:nowrap}
.hchip.on{background:#fff;color:#000}
.dlside{display:flex;align-items:center;gap:4px;flex:none;color:rgba(255,255,255,.6);font-size:13px}
.dldel{min-width:44px;min-height:44px;border:0;background:none;color:rgba(255,255,255,.7);border-radius:22px;font:inherit;font-size:13px}
.dldel.arm{color:#ff6b6b;font-weight:700}
.dlbar{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
.dlbar .hint{margin:0;flex:1}
.scene{display:block;width:100%;height:260px;margin:10px 0 6px;border-radius:12px;background:#141414;touch-action:none}
.scenetip{font-size:12px;color:rgba(255,255,255,.55);margin:0 0 8px}
/* ---------- player buttons in groups ---------- */
.fchips[hidden]{display:none}
.fchips.sub{margin-top:8px;flex-wrap:wrap;overflow-x:visible}
.fchips.sub .chipbtn>[data-icon]{display:none}
.fchips.sub .chipbtn{background:rgba(255,255,255,.16)}
.fchips.sub .chipbtn.on{background:#fff;color:#000}
.chipbtn.grp{gap:4px;padding-right:10px}
.chipbtn.grp .car{display:inline-flex;transition:transform .2s ease}
.chipbtn.grp .car svg{width:18px;height:18px}
.chipbtn.grp[aria-expanded="true"]{background:rgba(255,255,255,.28)}
.chipbtn.grp[aria-expanded="true"] .car{transform:rotate(180deg)}
/* ---------- motion ---------- */
body.calm *,body.calm *::before,body.calm *::after{animation:none!important}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes artIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes dim{from{opacity:0}to{opacity:1}}
@keyframes bars{0%{background-size:4px 30%,4px 75%,4px 45%}33%{background-size:4px 80%,4px 35%,4px 65%}66%{background-size:4px 45%,4px 90%,4px 30%}100%{background-size:4px 30%,4px 75%,4px 45%}}
/* a page arriving: the whole page, then its sections and rows one after another */
.page.enter{animation:pgIn .26s ease both}
.page.enter .sec,.page.enter>div>.row,.page.enter .hchips,.page.enter .dlbar{animation:itemIn .38s cubic-bezier(.2,.8,.3,1) both}
.page.enter .sec:nth-child(2),.page.enter>div>.row:nth-child(2){animation-delay:.04s}
.page.enter .sec:nth-child(3),.page.enter>div>.row:nth-child(3){animation-delay:.08s}
.page.enter .sec:nth-child(4),.page.enter>div>.row:nth-child(4){animation-delay:.12s}
.page.enter .sec:nth-child(5),.page.enter>div>.row:nth-child(5){animation-delay:.16s}
.page.enter .sec:nth-child(6),.page.enter>div>.row:nth-child(6){animation-delay:.2s}
.page.enter .sec:nth-child(n+7),.page.enter>div>.row:nth-child(n+7){animation-delay:.24s}
/* things give a little under the finger */
.row,.card,.chipbtn,.hchip,.btn,.iconbtn,#nav a,.dldel{transition:transform .14s ease,background-color .2s ease,color .2s ease}
/* queue rows are moved by the finger directly, so they must follow it without easing */
#qlist .row{transition:none}
.row:active{transform:scale(.985)}
.card:active{transform:scale(.96)}
.chipbtn:active,.hchip:active,.btn:active{transform:scale(.94)}
.iconbtn:active,#nav a:active{transform:scale(.88)}
/* pictures fade in as they arrive */
.thumb img.in{animation:dim .35s ease both}
/* the song that is playing shows moving bars over its picture */
.now .thumb::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background-color:rgba(0,0,0,.55);background-image:linear-gradient(#fff,#fff),linear-gradient(#fff,#fff),linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:calc(50% - 8px) 68%,50% 68%,calc(50% + 8px) 68%;background-size:4px 30%,4px 75%,4px 45%;animation:bars .9s ease-in-out infinite;animation-play-state:paused}
.card.now .thumb::after{background-size:6px 30%,6px 75%,6px 45%}
body.playing .now .thumb::after{animation-play-state:running}
/* the big picture settles back when paused and comes forward when playing */
#fullArt{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
body:not(.playing) #fullArt{transform:scale(.9)}
#fullArt img{animation:artIn .45s ease both}
#fPlay{transition:transform .16s ease}
#fPlay:active{transform:scale(.9)}
.chipbtn.on svg,#nav a.on svg{animation:pop .32s ease}
/* sheets rise from the bottom */
#sheet.enter{animation:dim .2s ease both}
#sheet.enter .panel{animation:sheetUp .3s cubic-bezier(.2,.9,.3,1) both}
#toast{transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1);transform:translateX(-50%) translateY(10px)}
#toast.show{transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}body:not(.playing) #fullArt{transform:none}}
/* title that travels when it is too long for one line */
@keyframes mq{0%,18%{transform:translateX(0)}50%,68%{transform:translateX(var(--mq))}100%{transform:translateX(0)}}
.ftitle{text-overflow:clip}
.ftitle .mqt{display:inline-block;white-space:nowrap;will-change:transform}
.ftitle.long .mqt{animation:mq var(--mqs) ease-in-out infinite}
.ftitle.tap,.fsub .lk{cursor:pointer}
.fsub{padding:6px 0;margin-top:0}
.fsub .lk{color:var(--fg);text-decoration:none;font-weight:500;padding:8px 0}
.fsub .lk:active,.ftitle.tap:active{opacity:.6}
.lyrics{white-space:pre-wrap;font-size:17px;line-height:1.75;color:var(--fg);word-break:break-word}
.lyricsrc{margin-top:14px;font-size:12px;color:var(--fg2)}
/* ---------- lyrics mode ---------- */
#full.lyr #fullArt{display:none}
#full:not(.lyr) #lyrView{display:none}
#lyrView{flex:1 1 0;min-height:200px;margin:2px 0 8px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 70%,transparent)}
#lyrView::-webkit-scrollbar{display:none}
#lyrBody{padding:34% 4px 62%}
.lyl{font-size:27px;line-height:1.28;font-weight:800;padding:10px 0;color:rgba(255,255,255,.3);transform-origin:left center;transition:color .4s ease,transform .4s ease;word-break:break-word}
.lyl.cur{color:#fff;transform:scale(1.04)}
.lyl.past{color:rgba(255,255,255,.18)}
.lyl.gap{padding:14px 0}
#lyrBody.flat .lyl{color:rgba(255,255,255,.82)}
#lyrBody.sync .lyl{cursor:pointer}
.lyhint{font-size:12px;color:rgba(255,255,255,.5);padding:0 0 12px}

/* ---------- router ---------- */
var view = $('view');
var cache = {};
var scrollPos = {};
var viewToken = 0;
var lastHash = '';
var TTL = 5 * 60 * 1000;
var curTab = 'home';

function cacheGet(key) {
  var c = cache[key];
  if (c && Date.now() - c.t < TTL) return c.d;
  return null;
}

function loadInto(vt, host, key, url, render, big) {
  var d = cacheGet(key);
  if (d) {
    render(d);
    restoreScroll();
    return;
  }
  var sk = skeleton(big);
  host.appendChild(sk);
  api(url).then(function (data) {
    if (vt !== viewToken) return;
    cache[key] = { t: Date.now(), d: data };
    sk.remove();
    render(data);
    restoreScroll();
  }).catch(function (e) {
    if (vt !== viewToken) return;
    sk.remove();
    host.appendChild(errorBox(e.message, function () { delete cache[key]; route(true); }));
  });
}

function restoreScroll() {
  var y = scrollPos[location.hash || '#/home'];
  view.scrollTop = y || 0;
}

function setTab(t) {
  var as = document.querySelectorAll('#nav a');
  for (var i = 0; i < as.length; i++) {
    as[i].classList.toggle('on', as[i].getAttribute('data-tab') === t);
  }
}

function route(force) {
  var h = location.hash || '#/home';
  if (!force && lastHash) scrollPos[lastHash] = view.scrollTop;
  if (force && lastHash === h) scrollPos[h] = view.scrollTop;
  lastHash = h;
  var vt = ++viewToken;
  view.textContent = '';
  var page = el('div', 'page enter');
  view.appendChild(page);
  /* Only what is there when the page arrives is animated in; later redraws are not. */
  setTimeout(function () { page.classList.remove('enter'); }, 900);
  var m;
  if ((m = /^#\/browse\/(.+)$/.exec(h))) {
    var id = decodeURIComponent(m[1]);
    setTab(curTab);
    renderBrowse(vt, page, id);
  } else if (/^#\/history/.test(h)) {
    curTab = 'history';
    setTab('history');
    renderHistory(vt, page);
  } else if (/^#\/downloads/.test(h)) {
    curTab = 'downloads';
    setTab('downloads');
    renderDownloads(vt, page);
  } else if (/^#\/search/.test(h)) {
    curTab = 'search';
    setTab('search');
    var qm = /[?&]q=([^&]*)/.exec(h);
    var q = qm ? decodeURIComponent(qm[1].replace(/\+/g, ' ')) : '';
    renderSearch(vt, page, q);
  } else {
    curTab = 'home';
    setTab('home');
    renderHome(vt, page);
  }
}

/* ---------- home filters ---------- */
var homeFilter = '';
var homeChips = [];
/* The ids of the songs, albums and playlists in a home feed. */
function feedIds(d) {
  var set = {}, n = 0;
  (function walk(x) {
    if (Array.isArray(x)) { x.forEach(walk); return; }
    if (!x || typeof x !== 'object') return;
    var k = x.videoId || x.browseId || x.playlistId;
    if (typeof k === 'string' && k && !set[k]) { set[k] = 1; n++; }
    Object.keys(x).forEach(function (key) { walk(x[key]); });
  })(d && d.sections);
  return { set: set, n: n };
}
function homeUrl(extra) {
  var parts = [];
  if (homeFilter) parts.push('p=' + enc(homeFilter));
  if (extra) parts.push(extra);
  return '/api/home' + (parts.length ? '?' + parts.join('&') : '');
}
function chipRow() {
  var row = el('div', 'hchips');
  homeChips.forEach(function (c) {
    var b = el('button', 'hchip' + (homeFilter === c.params ? ' on' : ''), c.title);
    b.type = 'button';
    b.setAttribute('aria-pressed', homeFilter === c.params ? 'true' : 'false');
    b.addEventListener('click', function () {
      /* Tapping the chosen filter again goes back to the normal home feed. */
      homeFilter = (homeFilter === c.params) ? '' : c.params;
      delete cache.home;
      view.scrollTop = 0;
      scrollPos['#/home'] = 0;
      route(true);
    });
    row.appendChild(b);
  });
  return row;
}

function renderHome(vt, page) {
  page.classList.add('home');
  var tb = el('div', 'topbar');
  tb.appendChild(el('h1', null, '首頁'));
  var gear = el('button', 'iconbtn');
  gear.type = 'button';
  gear.setAttribute('aria-label', '設定');
  gear.appendChild(icon('gear'));
  gear.addEventListener('click', openSheet);
  tb.appendChild(gear);
  page.appendChild(tb);
  var host = el('div');
  page.appendChild(host);
  var nextToken = '';
  var loadingMore = false;
  var draw = function (d) {
    host.textContent = '';
    if (d.chips && d.chips.length) homeChips = d.chips;
    if (homeChips.length) host.appendChild(chipRow());
    /* Shown while the PC cannot be reached; the glue shows and hides it as that changes. */
    var away = el('div', 'notice', '離線模式：連不到電腦');
    away.id = 'pcNotice';
    away.style.display = window.__ytmGlue && window.__ytmGlue.offline && window.__ytmGlue.offline() ? '' : 'none';
    host.appendChild(away);
    if (!d.sections || !d.sections.length) {
      host.appendChild(el('div', 'hint', '目前沒有內容'));
    } else {
      renderSections(host, d.sections, 'home');
    }
    nextToken = d.next || '';
  };
  var onScroll = function () {
    if (vt !== viewToken) { view.removeEventListener('scroll', onScroll); return; }
    if (!nextToken || loadingMore) return;
    if (view.scrollTop + view.clientHeight < view.scrollHeight - 700) return;
    loadingMore = true;
    api(homeUrl('c=' + enc(nextToken))).then(function (d) {
      if (vt !== viewToken) return;
      renderSections(host, d.sections, 'home');
      nextToken = d.next || '';
    }).catch(function () { nextToken = ''; }).then(function () {
      loadingMore = false;
      onScroll();
    });
  };
  view.addEventListener('scroll', onScroll);
  var cached = cache.home ? cache.home.d : null;
  var sk = null;
  if (cached) {
    draw(cached);
    restoreScroll();
  } else {
    sk = skeleton(false);
    host.appendChild(sk);
  }
  /* Always ask for a fresh feed; what was shown before is only a placeholder. */
  var tries = 0;
  /* Bumped by every fresh feed that lands, so a slower plain answer cannot replace it. */
  var freshGen = 0, freshBusy = false;
  var wantFresh = homeWantFresh;
  homeWantFresh = false;
  var refresh = function () {
    var gen = freshGen;
    api(homeUrl(wantFresh ? 'fresh=1' : '')).then(function (d) {
      if (vt !== viewToken || gen !== freshGen) return;
      tries++;
      /* The signed-in feed can take a while to arrive from the PC; check back a few times. */
      /* (Not inside the app: nothing is being fetched by a PC there, so asking again changes
         nothing and only redraws the list every few seconds.) */
      if (d.personalized === false && tries < 5 && !window.__ytmStandalone) setTimeout(refresh, 6000);
      if (d.personalized === false && cache.home && cache.home.d.personalized) return;
      cache.home = { t: Date.now(), d: d };
      if (cached && view.scrollTop > 200) return;
      cached = d;
      draw(d);
      onScroll();
    }).catch(function (e) {
      if (vt !== viewToken || cached) return;
      if (sk) sk.remove();
      host.appendChild(errorBox(e.message, function () { route(true); }));
    });
  };
  /* quiet: started by the app itself (launch, back after a long while) - no messages, and the
     list stays where the user is looking. */
  homeRefresh = function (done, quiet) {
    if (quiet && freshBusy) { if (done) done(); return; }
    freshBusy = true;
    api(homeUrl('fresh=1')).then(function (d) {
      if (vt !== viewToken) return;
      /* Right after the PC server starts it may only have the general feed; keep what is shown. */
      if (d.personalized === false && cached && cached.personalized) { if (!quiet) toast('電腦端還在取得最新內容，請稍後再拉一次'); return; }
      freshGen++;
      /* what is new compared with what was on screen, to tell the user and the log */
      var was = cached ? feedIds(cached) : null, now = feedIds(d), added = 0;
      Object.keys(now.set).forEach(function (k) { if (!was || !was.set[k]) added++; });
      cache.home = { t: Date.now(), d: d };
      cached = d;
      var top = view.scrollTop;
      if (sk) { sk.remove(); sk = null; }
      draw(d);
      view.scrollTop = quiet ? top : 0;
      onScroll();
      dbg('I', 'home-refresh', { items: now.n, added: added, personal: d.personalized === false ? 0 : 1, quiet: quiet ? 1 : 0 });
      if (!quiet) toast(added ? '已更新（' + added + ' 項新內容）' : '已更新，內容和剛才相同');
    }).catch(function (e) { if (!quiet) toast('更新失敗：' + e.message); }).then(function () {
      freshBusy = false;
      if (done) done();
    });
  };
  homeRefresh.vt = vt;
  refresh();
}

function renderSearch(vt, page, q) {
  var tb = el('div', 'topbar');
  tb.appendChild(el('h1', null, '搜尋'));
  page.appendChild(tb);
  var form = el('form', 'sform');
  var input = document.createElement('input');
  input.type = 'search';
  input.placeholder = '搜尋歌曲、專輯、歌手';
  input.setAttribute('enterkeyhint', 'search');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.value = q;
  form.appendChild(input);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v) return;
    lsSet('ytm_lastq', v);
    input.blur();
    var nh = '#/search?q=' + enc(v);
    if (location.hash === nh) {
      delete cache['q:' + v];
      route(true);
    } else {
      location.hash = nh;
    }
  });
  page.appendChild(form);
  var host = el('div');
  page.appendChild(host);
  if (!q) {
    var last = lsGet('ytm_lastq');
    host.appendChild(el('div', 'hint', '輸入關鍵字開始搜尋'));
    if (last) {
      var b = el('button', 'btn ghost', '上次搜尋：' + last);
      b.type = 'button';
      b.addEventListener('click', function () { location.hash = '#/search?q=' + enc(last); });
      var w = el('div', 'hint');
      w.appendChild(b);
      host.appendChild(w);
    }
    return;
  }
  loadInto(vt, host, 'q:' + q, '/api/search?q=' + enc(q), function (d) {
    if (!d.sections || !d.sections.some(function (s) { return s && s.items && s.items.length; })) {
      host.appendChild(el('div', 'hint', '找不到結果'));
      return;
    }
    renderSections(host, d.sections, 'list');
  });
}

function renderBrowse(vt, page, id) {
  var tb = el('div', 'topbar');
  var back = el('button', 'iconbtn');
  back.type = 'button';
  back.setAttribute('aria-label', '返回');
  back.appendChild(icon('back'));
  back.addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.hash = '#/home';
  });
  tb.appendChild(back);
  page.appendChild(tb);
  var host = el('div');
  page.appendChild(host);
  loadInto(vt, host, 'b:' + id, '/api/browse?id=' + enc(id), function (d) {
    var head = el('div', 'bhead');
    head.appendChild(makeThumb({ thumb: d.thumb, kind: 'other' }));
    head.appendChild(el('h2', null, d.title || ''));
    if (d.subtitle) head.appendChild(el('p', null, d.subtitle));
    var songs = [];
    var seen = {};
    (d.sections || []).forEach(function (s) {
      ((s && s.items) || []).forEach(function (it) {
        if (isSong(it) && !seen[it.videoId]) {
          seen[it.videoId] = 1;
          songs.push(it);
        }
      });
    });
    var pb = el('button', 'btn', '全部播放');
    pb.type = 'button';
    pb.disabled = !songs.length;
    pb.addEventListener('click', function () { playAll(songs); openFull(); });
    head.appendChild(pb);
    host.appendChild(head);
    renderSections(host, d.sections, 'list');
  }, true);
}

/* ---------- wiring ---------- */
function bindUI() {
  initIcons();
  $('miniOpen').addEventListener('click', openFull);
  $('fullClose').addEventListener('click', closeFull);
  $('fullGear').addEventListener('click', openSheet);
  $('miniPlay').addEventListener('click', function () { togglePlay(); });
  $('fPlay').addEventListener('click', function () { togglePlay(); });
  $('miniNext').addEventListener('click', function () { next(true); });
  $('fNext').addEventListener('click', function () { next(true); });
  $('fPrev').addEventListener('click', function () { prev(true); });
  $('nextBar').addEventListener('click', openQueue);
  $('qClose').addEventListener('click', closeQueue);
  $('fStyle').addEventListener('click', openStyles);
  $('fProfile').addEventListener('click', toggleProfile);
  $('fMix').addEventListener('click', toggleMix);
  renderMixChip();
  renderProfileChip();
  $('fEq').addEventListener('click', openEq);
  renderEqChip();
  renderStyleChip();
  $('fLike').addEventListener('click', function () { setLike('LIKE'); });
  $('fDislike').addEventListener('click', function () { setLike('DISLIKE'); });
  $('fComments').addEventListener('click', openComments);
  $('fLyrics').addEventListener('click', toggleLyrics);
  /* The two group buttons each open one extra row; only one is open at a time. */
  var groups = [['fGrpSound', 'rowSound'], ['fGrpMore', 'rowMore']];
  groups.forEach(function (g) {
    $(g[0]).addEventListener('click', function () {
      var open = $(g[1]).hidden;
      groups.forEach(function (x) {
        $(x[1]).hidden = !(open && x === g);
        $(x[0]).setAttribute('aria-expanded', open && x === g ? 'true' : 'false');
      });
      setTimeout(titleFit, 60);
    });
  });
  ['touchstart', 'wheel'].forEach(function (n) {
    $('lyrView').addEventListener(n, function () { LY.userAt = Date.now(); }, { passive: true });
  });
  $('fullTitle').addEventListener('click', function () { if (TL.album) goBrowse(TL.album); });
  window.addEventListener('resize', titleFit);
  $('fSave').addEventListener('click', openSave);
  $('fShare').addEventListener('click', shareSong);
  $('fDl').addEventListener('click', dlChipTap);
  initPull();
  initSwipeClose();
  initQueueSwipeClose();
  $('fShuffle').addEventListener('click', function () {
    S.shuffle = !S.shuffle;
    lsSet('ytm_shuffle', S.shuffle ? '1' : '0');
    if (S.shuffle) shuffleUpcoming();
    renderToggles();
  });
  $('fRepeat').addEventListener('click', function () {
    S.repeat = S.repeat === 'off' ? 'all' : (S.repeat === 'all' ? 'one' : 'off');
    lsSet('ytm_repeat', S.repeat);
    renderToggles();
    extendQueue();
  });
  $('fSurround').addEventListener('click', function () {
    S.surround = !S.surround;
    lsSet('ytm_surround', S.surround ? '1' : '0');
    fxApply();
    renderToggles();
    renderPlayer();
  });
  $('fAB').addEventListener('click', cycleAb);
  renderToggles();
  $('fRetry').addEventListener('click', function () {
    if (S.cur) playTrack(S.cur, true);
  });
  $('sheet').addEventListener('click', function (e) {
    if (e.target === $('sheet')) closeSheet();
  });

  var seek = $('seek');
  seek.addEventListener('input', function () {
    S.dragging = true;
    var max = +seek.max || 1;
    seek.style.setProperty('--p', (+seek.value / max * 100) + '%');
    $('tCur').textContent = fmt(+seek.value);
  });
  seek.addEventListener('change', function () {
    S.dragging = false;
    seekTo(+seek.value);
  });
  var endDrag = function () {
    setTimeout(function () { S.dragging = false; }, 300);
  };
  seek.addEventListener('pointerup', endDrag);
  seek.addEventListener('touchend', endDrag);

  window.addEventListener('hashchange', function () { route(false); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheet(); closeFull(); }
  });

  remoteControls();
  dbg('I', 'remote-ready');
}

/* ---------- remember what was playing ---------- */
var lastSave = 0;
function saveState(force) {
  if (!S.cur) return;
  var now = Date.now();
  if (!force && now - lastSave < 4000) return;
  lastSave = now;
  var from = Math.max(0, S.index - 5);
  var pos = S.ready ? curTime() : (S.resumeAt || 0);
  lsSet('ytm_state', JSON.stringify({ at: now, index: S.index - from, queue: S.queue.slice(from, from + 60), t: pos }));
}
function restoreState() {
  var d = null;
  try { d = JSON.parse(lsGet('ytm_state') || 'null'); } catch (e) { d = null; }
  if (!d || !d.queue || !d.queue.length || Date.now() - d.at > 24 * 3600 * 1000) return;
  var q = d.queue.filter(isSong);
  var i = Math.min(Math.max(0, d.index | 0), q.length - 1);
  if (q.length !== d.queue.length || i < 0) return;
  S.queue = q;
  S.index = i;
  S.cur = q[i];
  S.vid = q[i].videoId;
  S.resumeAt = +d.t || 0;
  S.resumeVid = q[i].videoId;
  S.trueDur = parseDur(q[i].duration);
  renderPlayer();
  if (S.trueDur > 0) updateProgress(S.resumeAt, S.trueDur);
}
window.addEventListener('pagehide', function () { saveState(true); });
document.addEventListener('visibilitychange', function () { if (document.hidden) saveState(true); });

bindUI();
restoreState();
/* loaded again after the system ended the page: the player that was open is opened again */
if (window.__ytmReloaded && lsGet('ytm_full') === '1' && S.cur) openFull();
renderQueue();
route(true);
})();
</script>
