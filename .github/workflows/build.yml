name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # The sound code is tested for real here (the app itself can only be compiled). A failing
      # test fails the workflow; the app is still built so that its compile errors show too.
      - name: Test sound code
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
      - name: Build the Python runtime
        if: always()
        run: |
          set -o pipefail
          python3 tools/build-python.py 2>&1 | tee python.log
      # The "band" surround's separation model: demucs' htdemucs, its network body converted to
      # Core ML and compiled (tools/band/convert.py, which also checks Core ML against torch).
      # Test builds only: the weights' licence is unclear. If this fails, the app is built
      # without the model and the band modes play the original sound.
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        if: always()
        with:
          path: |
            ~/.cache/torch/hub/checkpoints
            ~/Library/Caches/pip
          key: band-model-v1
      - name: Convert the band model
        if: always()
        run: |
          set -o pipefail
          mkdir -p BandModel
          python -m venv "$RUNNER_TEMP/band" && . "$RUNNER_TEMP/band/bin/activate"
          pip install -q "numpy<2" torch==2.5.1 torchaudio==2.5.1 demucs==4.0.1 coremltools==8.3.0 2>&1 | tail -5
          python -c "import torch, coremltools, demucs; print('torch', torch.__version__, 'coremltools', coremltools.__version__, 'demucs', demucs.__version__)"
          status=0
          python tools/band/convert.py "$RUNNER_TEMP/bandout" 2>&1 | grep -v -i warn | tee band.log || status=$?
          cp "$RUNNER_TEMP/bandout/check.json" band-check.json || true
          [ "$status" = 0 ] || exit "$status"
          xcrun coremlcompiler compile "$RUNNER_TEMP/bandout/HTDemucsBody.mlpackage" BandModel/ | tee -a band.log
          du -sh "$RUNNER_TEMP/bandout/HTDemucsBody.mlpackage" BandModel/HTDemucsBody.mlmodelc | tee -a band.log
      - name: Generate project
        if: always()
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project YTMRemote.xcodeproj -scheme YTMRemote -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error|warning: unre|BUILD|\.swift:[0-9]+" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Package
        if: always()
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YTMRemote.app Payload/
          zip -qr YTMRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            python.log
            band.log
            band-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: YTMRemote-ipa
          path: YTMRemote.ipa
      # Pushing a tag such as v1.0.0 publishes the ipa as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" YTMRemote.ipa --title "$GITHUB_REF_NAME" --generate-notes
